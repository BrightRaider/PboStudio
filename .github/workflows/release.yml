name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test tests/PboStudio.Tests/PboStudio.Tests.csproj -c Release --nologo

      # Single file, no .NET install needed on the target machine. Prime95 and y-cruncher are
      # fetched from the vendors on first run rather than redistributed here.
      - name: Publish single-file build
        run: >
          dotnet publish src/PboStudio.App/PboStudio.App.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out/single

      - name: Strip build leftovers
        shell: pwsh
        run: |
          Remove-Item out/single/*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item out/single/engines -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem out/single | Format-Table Name, Length

      - name: Verify it is really one executable
        shell: pwsh
        run: |
          $exe = 'out/single/PboStudio.exe'
          if (-not (Test-Path $exe)) { throw 'PboStudio.exe missing' }
          if (Test-Path 'out/single/PboStudio.runtimeconfig.json') {
            throw 'Not self-contained: a runtimeconfig.json is present'
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "PboStudio.exe = $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: PboStudio-single-file
          path: out/single/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/single/PboStudio.exe
            LICENSE
          body_path: CHANGELOG.md
          draft: true
