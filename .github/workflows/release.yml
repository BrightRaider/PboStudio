name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test tests/PboStudio.Tests/PboStudio.Tests.csproj -c Release --nologo

      # Single file, no .NET install needed on the target machine.
      - name: Publish single-file build
        run: >
          dotnet publish src/PboStudio.App/PboStudio.App.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out/single

      - name: Strip build leftovers
        shell: pwsh
        run: |
          Remove-Item out/single/*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item out/single/engines -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem out/single | Format-Table Name, Length

      - name: Verify it is really one executable
        shell: pwsh
        run: |
          $exe = 'out/single/PboStudio.exe'
          if (-not (Test-Path $exe)) { throw 'PboStudio.exe missing' }
          if (Test-Path 'out/single/PboStudio.runtimeconfig.json') {
            throw 'Not self-contained: a runtimeconfig.json is present'
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "PboStudio.exe = $mb MB"

      # Offline bundle. The engines are fetched here rather than committed, so the repository
      # stays small and the archives always come from the vendors themselves.
      - name: Assemble offline bundle
        shell: pwsh
        run: |
          $bundle = 'out/full'
          New-Item -ItemType Directory -Force -Path "$bundle/engines/prime95" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/engines/ycruncher" | Out-Null
          Copy-Item out/single/PboStudio.exe $bundle
          Copy-Item LICENSE $bundle

          $sources = @(
            @{ Name = 'Prime95';    Dir = "$bundle/engines/prime95";   Url = 'https://www.mersenne.org/download/software/v30/30.8/p95v308b17.win64.zip' },
            @{ Name = 'y-cruncher'; Dir = "$bundle/engines/ycruncher"; Url = 'https://cdn.numberworld.org/y-cruncher-downloads/y-cruncher%20v0.8.7.9547b.zip' }
          )

          foreach ($s in $sources) {
            $tmp = Join-Path $env:RUNNER_TEMP "$($s.Name).zip"
            Write-Host "Downloading $($s.Name)…"
            Invoke-WebRequest -Uri $s.Url -OutFile $tmp -UseBasicParsing

            # Guard against a vendor answering a retired link with an HTML page.
            $head = [System.IO.File]::ReadAllBytes($tmp)[0..1]
            if ($head[0] -ne 0x50 -or $head[1] -ne 0x4B) {
              throw "$($s.Name): downloaded file is not a ZIP archive"
            }
            Expand-Archive -Path $tmp -DestinationPath $s.Dir -Force
          }

          if (-not (Test-Path "$bundle/engines/prime95/prime95.exe")) {
            throw 'Bundle is missing prime95.exe'
          }
          Write-Host "Bundle size: $([math]::Round((Get-ChildItem $bundle -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - name: Compress offline bundle
        shell: pwsh
        run: Compress-Archive -Path out/full/* -DestinationPath out/PboStudio-full.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: PboStudio-single-file
          path: out/single/PboStudio.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PboStudio-offline-bundle
          path: out/PboStudio-full.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/single/PboStudio.exe
            out/PboStudio-full.zip
            LICENSE
          body_path: CHANGELOG.md
          draft: true
