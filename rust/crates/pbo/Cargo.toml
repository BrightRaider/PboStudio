[package]
name = "pbo"
description = "PboStudio command line. Stage E0: `pbo diag`, read-only."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pbo"
path = "src/main.rs"

[dependencies]
pbo-core = { path = "../pbo-core" }
pbo-os = { path = "../pbo-os" }
pbo-smu = { path = "../pbo-smu" }
pbo-app = { path = "../pbo-app" }
pbo-ui = { path = "../pbo-ui" }
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
