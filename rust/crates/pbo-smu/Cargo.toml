[package]
name = "pbo-smu"
description = "PboStudio hardware access: the PawnIO driver, SMN and MSR reads, the SMU mailbox and the PM table."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pbo-core = { path = "../pbo-core" }
pbo-os = { path = "../pbo-os" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
